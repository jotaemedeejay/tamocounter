<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAMO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    #btn {
      font-size: 2.5rem;
      font-weight: 900;
      padding: 24px 48px;
      background: #ffe94d;
      color: #111;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 3px;
      transition: transform 0.08s, background 0.1s;
      user-select: none;
    }

    #btn:active {
      transform: scale(0.93);
      background: #ffd700;
    }

    #count {
      font-size: 6rem;
      font-weight: 900;
      color: #ffe94d;
      min-width: 80px;
      text-align: left;
    }
  </style>
</head>
<body>

  <button id="btn" onclick="sumar()">tamo</button>
  <div id="count">0</div>

  <script>
    let n = 0;
    function sumar() {
      document.getElementById('count').textContent = ++n;
    }
  </script>

</body>
</html>
